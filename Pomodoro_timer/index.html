<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus - Pomodoro Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div class="app-container">
        <header>
            <h1 class="logo">FOCUS</h1>
            <div class="header-actions">
                <div class="toggle-container">
                    <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                        <i data-lucide="moon" class="moon-icon"></i>
                        <i data-lucide="sun" class="sun-icon"></i>
                    </button>
                </div>
                <div class="toggle-container">
                    <button id="settings-btn" class="icon-btn" aria-label="Settings">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Timer Card -->
            <div class="card timer-card">
                <div class="mode-tabs">
                    <button class="mode-tab active" data-mode="pomodoro">Pomodoro</button>
                    <button class="mode-tab" data-mode="shortBreak">Short Break</button>
                    <button class="mode-tab" data-mode="longBreak">Long Break</button>
                </div>

                <div class="time-display" id="time-display">25:00</div>

                <div class="controls">
                    <button id="start-btn" class="btn primary">START</button>
                    <button id="pause-btn" class="btn secondary">PAUSE</button>
                    <button id="reset-btn" class="btn outline">RESET</button>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <!-- Stats Card -->
            <div class="card stat-card">
                <h3>COMPLETED POMODOROS</h3>
                <div class="stat-number" id="completed-pomodoros">0</div>
            </div>

            <!-- Tasks Card -->
            <div class="card task-card">
                <h3>Current Tasks</h3>
                <div class="task-input-container">
                    <input type="text" id="task-input" placeholder="What are you working on?">
                    <button id="add-task-btn" class="btn primary small">Add</button>
                </div>
                <ul id="task-list" class="task-list"></ul>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2>Settings</h2>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h4>TIMER DURATIONS (MINUTES)</h4>
                    <div class="setting-row">
                        <span>Pomodoro:</span>
                        <input type="number" id="pomo-duration" min="1" max="90" value="25">
                    </div>
                    <div class="setting-row">
                        <span>Short Break:</span>
                        <input type="number" id="short-break-duration" min="1" max="30" value="5">
                    </div>
                    <div class="setting-row">
                        <span>Long Break:</span>
                        <input type="number" id="long-break-duration" min="1" max="60" value="15">
                    </div>
                </div>

                <div class="settings-section">
                    <h4>NOTIFICATIONS & AUDIO</h4>
                    <div class="setting-row">
                        <span>Desktop Notifications:</span>
                        <input type="checkbox" id="desktop-notif">
                    </div>
                    <div class="setting-row">
                        <span>Play Alarm Chime:</span>
                        <input type="checkbox" id="play-alarm" checked>
                    </div>
                    <div class="setting-row">
                        <span>Ambient Sound:</span>
                        <select id="ambient-sound">
                            <option value="none">None</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="close-settings" class="btn text-btn">CLOSE</button>
                <button id="save-settings" class="btn primary">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
