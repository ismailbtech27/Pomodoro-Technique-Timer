<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Focus</h1>
            <div class="header-controls">
                <button id="theme-btn" class="icon-btn" aria-label="Toggle Theme">🌓</button>
                <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
            </div>
        </header>

        <main class="timer-container glass-panel">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
                <button class="mode-btn" data-mode="shortBreak">Short Break</button>
                <button class="mode-btn" data-mode="longBreak">Long Break</button>
            </div>

            <div class="timer-display">
                <span id="minutes">25</span><span class="colon">:</span><span id="seconds">00</span>
            </div>

            <div class="controls">
                <button id="start-btn" class="control-btn primary">Start</button>
                <button id="pause-btn" class="control-btn secondary" disabled>Pause</button>
                <button id="reset-btn" class="control-btn danger">Reset</button>
            </div>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </main>
        
        <div class="stats-container glass-panel">
            <div>
                <p>Completed Pomodoros</p>
                <h3 id="pomodoro-count">0</h3>
            </div>
        </div>

        <section class="tasks-container glass-panel">
            <h2>Current Tasks</h2>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="What are you working on?">
                <button id="add-task-btn">Add</button>
            </div>
            <ul id="task-list" class="task-list">
                <!-- Task items will be inserted here -->
            </ul>
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal glass-panel">
            <h2>Settings</h2>
            
            <div class="settings-group">
                <h3>Timer Durations (minutes)</h3>
                <div class="settings-row">
                    <label>Pomodoro:</label>
                    <input type="number" id="setting-pomodoro" value="25" min="1" max="120">
                </div>
                <div class="settings-row">
                    <label>Short Break:</label>
                    <input type="number" id="setting-short" value="5" min="1" max="60">
                </div>
                <div class="settings-row">
                    <label>Long Break:</label>
                    <input type="number" id="setting-long" value="15" min="1" max="60">
                </div>
            </div>

            <div class="settings-group">
                <h3>Notifications & Audio</h3>
                <div class="settings-row">
                    <label>Desktop Notifications:</label>
                    <input type="checkbox" id="setting-notifications">
                </div>
                <div class="settings-row">
                    <label>Play Alarm Chime:</label>
                    <input type="checkbox" id="setting-alarm" checked>
                </div>
                <div class="settings-row">
                    <label>Ambient Sound:</label>
                    <select id="setting-ambient">
                        <option value="none">None</option>
                        <option value="rain">Rainfall</option>
                        <option value="cafe">Cafe Murmur</option>
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button id="close-settings-btn" class="control-btn secondary">Close</button>
                <button id="save-settings-btn" class="control-btn primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Elements using public domain placeholder sounds -->
    <audio id="alarm-audio" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <!-- Rain placeholder -->
    <audio id="ambient-rain" src="https://assets.mixkit.co/active_storage/sfx/2397/2397-preview.mp3" loop preload="auto"></audio>
    <!-- Cafe placeholder -->
    <audio id="ambient-cafe" src="https://assets.mixkit.co/active_storage/sfx/2143/2143-preview.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
